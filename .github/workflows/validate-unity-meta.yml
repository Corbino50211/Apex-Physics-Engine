name: Validate Unity Metadata

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  validate-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Unity metadata
        run: python3 Tools/validate_unity_meta.py
